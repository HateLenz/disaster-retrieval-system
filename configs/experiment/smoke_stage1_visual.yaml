name: smoke_stage1_visual
description: Representative smoke run for stage-1 pure image retrieval on a small but diverse subset.
log_dir: outputs/logs/smoke_stage1_visual

subset:
  enabled: true
  csv: data/processed/xbd_building_patches.csv
  output_csv: data/processed/xbd_building_patches_smoke_stage1.csv
  summary_json: outputs/logs/smoke_stage1_visual/subset_summary.json
  seed: 42
  group_by:
    - disaster_type
    - damage_label
  split_limits:
    tier3: 4096
    hold: 1024
  max_per_tile: 24
  max_per_disaster: 0

train:
  csv: data/processed/xbd_building_patches_smoke_stage1.csv
  train_split: tier3
  eval_split: hold
  checkpoint: checkpoints/clip_visual_baseline_smoke_stage1.pt
  train_log_jsonl: outputs/logs/smoke_stage1_visual/train_history.jsonl
  summary_json: outputs/logs/smoke_stage1_visual/train_summary.json
  model_name: pretrained/openai-clip-vit-base-patch32
  embedding_dim: 256
  image_size: 224
  batch_size: 16
  epochs: 6
  lr: 0.0001
  weight_decay: 0.0001
  temperature: 0.07
  num_workers: 4
  seed: 42
  device: cuda
  top_k: 10
  amp: true
  local_files_only: true
  disable_balanced_sampling: false
  loss_weighting: inverse_freq
  selection_metric: macro_recall@1

extract:
  csv: data/processed/xbd_building_patches_smoke_stage1.csv
  checkpoint: checkpoints/clip_visual_baseline_smoke_stage1.pt
  output: indexes/pre_clip_features_smoke_stage1.npy
  split: hold
  image_size: 224
  batch_size: 64
  num_workers: 4
  device: cuda
  amp: true
  view: pre
  model_name: pretrained/openai-clip-vit-base-patch32
  local_files_only: true

eval:
  csv: data/processed/xbd_building_patches_smoke_stage1.csv
  checkpoint: checkpoints/clip_visual_baseline_smoke_stage1.pt
  features: indexes/pre_clip_features_smoke_stage1.npy
  index: indexes/pre_clip_smoke_stage1.faiss
  results_csv: outputs/predictions/clip_retrieval_results_smoke_stage1.csv
  metrics_json: outputs/predictions/clip_retrieval_metrics_smoke_stage1.json
  split: hold
  image_size: 224
  batch_size: 64
  num_workers: 4
  top_k: 10
  device: cuda
  amp: true
  model_name: pretrained/openai-clip-vit-base-patch32
  local_files_only: true

tile_eval:
  csv: data/processed/xbd_building_patches_smoke_stage1.csv
  checkpoint: checkpoints/clip_visual_baseline_smoke_stage1.pt
  features: indexes/pre_clip_features_smoke_stage1.npy
  index: indexes/pre_clip_smoke_stage1_tile.faiss
  results_csv: outputs/predictions/clip_tile_retrieval_results_smoke_stage1.csv
  metrics_json: outputs/predictions/clip_tile_retrieval_metrics_smoke_stage1.json
  split: hold
  image_size: 224
  batch_size: 64
  num_workers: 4
  patch_top_k: 100
  tile_top_k: 10
  aggregation: top_m
  top_m: 5
  device: cuda
  amp: true
  model_name: pretrained/openai-clip-vit-base-patch32
  local_files_only: true

cases:
  results_csv: outputs/predictions/clip_retrieval_results_smoke_stage1.csv
  output_dir: outputs/figures/retrieval_cases_smoke_stage1
  top_k: 5
  num_cases: 24
  incorrect_only: true

sanity:
  features: indexes/pre_clip_features_smoke_stage1.npy
  feature_metadata_csv: indexes/pre_clip_features_smoke_stage1.csv
  retrieval_results_csv: outputs/predictions/clip_retrieval_results_smoke_stage1.csv
  report_json: outputs/logs/smoke_stage1_visual/sanity_report.json
  collapse_cosine_threshold: 0.9999
  top1_concentration_threshold: 0.20
  unique_ratio_threshold: 0.50

limitations:
  metrics_json: outputs/predictions/clip_retrieval_metrics_smoke_stage1.json
  results_csv: outputs/predictions/clip_retrieval_results_smoke_stage1.csv
  summary_json: outputs/logs/smoke_stage1_visual/visual_limitations_summary.json
  summary_md: outputs/logs/smoke_stage1_visual/visual_limitations_summary.md
  failed_cases_csv: outputs/logs/smoke_stage1_visual/visual_limitations_failed_cases.csv
  top_k: 10
  example_count: 12
